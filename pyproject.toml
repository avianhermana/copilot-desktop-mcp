[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copilot-desktop-mcp"
version = "1.0.0"
description = "A policy-controlled Model Context Protocol (MCP) server for Windows desktop automation, office documents, and local AI productivity."
readme = "README.md"
authors = [
    { name = "Avian Hermana", email = "avianhermana@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.0",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    "Pillow>=10.0",
    "pytesseract>=0.3",
    "pyperclip>=1.8",
    "psutil>=5.9",
    "qrcode>=7.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306; platform_system == 'Windows'",
]
meeting = [
    "pyaudiowpatch>=0.2.12; platform_system == 'Windows'",
    "faster-whisper>=1.0.0",
]
full = [
    "pywin32>=306; platform_system == 'Windows'",
    "pyaudiowpatch>=0.2.12; platform_system == 'Windows'",
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
copilot-desktop-mcp = "copilot_desktop_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["copilot_desktop_mcp"]
